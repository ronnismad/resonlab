<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Acoustudio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="55%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56B4E9"/>
      <stop offset="50%" stop-color="#3d8bfd"/>
      <stop offset="100%" stop-color="#7c6cf0"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ea8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="28" y="28" width="456" height="456" rx="96"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2a3344" stroke-width="8"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#3d8bfd" stroke-opacity="0.18" stroke-width="4"/>

  <g clip-path="url(#clip)">
    <!-- Resonator tube -->
    <rect x="96" y="168" width="320" height="176" rx="28" fill="url(#tube)" stroke="#4ea8ff" stroke-opacity="0.55" stroke-width="6"/>
    <!-- End walls -->
    <rect x="88" y="152" width="18" height="208" rx="6" fill="#5a6a82"/>
    <rect x="406" y="152" width="18" height="208" rx="6" fill="#5a6a82"/>

    <!-- Standing wave (n=2-ish) -->
    <path d="M110 256
             C150 176 190 176 230 256
             S310 336 350 256
             S400 176 420 256"
          fill="none" stroke="url(#wave)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nodes -->
    <circle cx="190" cy="256" r="12" fill="#f0657a"/>
    <circle cx="290" cy="256" r="12" fill="#f0657a"/>
    <circle cx="390" cy="256" r="10" fill="#e8a317"/>

    <!-- Wavefront arcs (Helmholtz / radiation cue) -->
    <path d="M120 120 C180 96 260 96 320 120" fill="none" stroke="#3ddea8" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M150 88 C200 70 260 70 310 88" fill="none" stroke="#3ddea8" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
    <path d="M320 400 C370 416 410 420 450 416" fill="none" stroke="#f0c14a" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
