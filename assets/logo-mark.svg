        fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="100" cy="128" r="6.5" fill="#f0657a"/>
  <circle cx="154" cy="128" r="6.5" fill="#f0657a"/>

  <!-- open arcs -->
  <path d="M72 58 C100 44 140 44 168 58" fill="none" stroke="#3ddea8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M92 42 C112 34 132 34 152 42" fill="none" stroke="#3ddea8" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
