      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56B4E9"/>
      <stop offset="100%" stop-color="#7c6cf0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="50" fill="none" stroke="#3d8bfd" stroke-opacity="0.22" stroke-width="3"/>

  <!-- tube -->
  <rect x="48" y="88" width="160" height="80" rx="16" fill="#3d8bfd" fill-opacity="0.14" stroke="#4ea8ff" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="44" y="80" width="10" height="96" rx="3" fill="#6b7588"/>
  <rect x="202" y="80" width="10" height="96" rx="3" fill="#6b7588"/>

  <!-- wave -->
