<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Acoustudio mode circle concept">
  <!-- Concept: circular cavity mode -->
  <rect width="64" height="64" rx="14" fill="#12161F"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#3D8BFD" stroke-width="2.5"/>
  <!-- nodal diameter -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#8B95A8" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- antinode lobes -->
  <path d="M32 16 C40 22 40 28 32 32 C24 28 24 22 32 16 Z" fill="#3D8BFD" fill-opacity="0.35"/>
  <path d="M32 48 C40 42 40 36 32 32 C24 36 24 42 32 48 Z" fill="#7C6CF0" fill-opacity="0.35"/>
  <!-- mode label ticks -->
  <circle cx="32" cy="22" r="2.5" fill="#F0657A"/>
  <circle cx="32" cy="42" r="2.5" fill="#F0657A"/>
</svg>
