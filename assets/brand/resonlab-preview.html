<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResonLab V1.3 — Logo</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c1420;color:#e8f2ff;font:15px/1.6 'Segoe UI',Arial,sans-serif;display:grid;place-items:center;padding:40px 24px}
  main{max-width:620px;text-align:center}h1{font-size:12px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;color:#99aec5;margin:0 0 35px}.mark{display:block;width:160px;height:160px;margin:0 auto 26px}.wordmark{display:block;width:min(420px,100%);margin:0 auto 30px}p{max-width:440px;margin:0 auto;color:#99aec5;font-size:14px}.sizes{display:flex;align-items:center;justify-content:center;gap:24px;margin:32px auto 0;padding-top:28px;border-top:1px solid #26374b}.sizes img{display:block}
</style>
<main>
  <h1>ResonLab V1.3 · Visual identity</h1>
  <img class="mark" src="resonlab-mark.svg" alt="Blue resonant chamber containing a teal pressure wave and a white node">
  <img class="wordmark" src="resonlab-horizontal.svg" alt="ResonLab V1.3 — Acoustic Resonator Studio">
  <p>A resonant cavity and its pressure wave. Blue defines the chamber, teal traces the wave, and the white point marks a node.</p>
  <div class="sizes" aria-label="Logo at application and favicon sizes">
    <img src="resonlab-mark.svg" width="16" height="16" alt="16 pixel mark">
    <img src="resonlab-mark.svg" width="24" height="24" alt="24 pixel mark">
    <img src="resonlab-mark.svg" width="32" height="32" alt="32 pixel mark">
    <img src="resonlab-mark.svg" width="48" height="48" alt="48 pixel mark">
  </div>
</main>
</html>
