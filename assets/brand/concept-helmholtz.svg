<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Acoustudio Helmholtz concept">
  <!-- Concept: Helmholtz resonator silhouette -->
  <rect width="64" height="64" rx="14" fill="#12161F"/>
  <!-- neck -->
  <rect x="26" y="12" width="12" height="16" rx="3" fill="#3D8BFD" fill-opacity="0.55" stroke="#3D8BFD" stroke-width="1.5"/>
  <!-- cavity -->
  <circle cx="32" cy="40" r="16" fill="#3D8BFD" fill-opacity="0.18" stroke="#3D8BFD" stroke-width="2.5"/>
  <!-- internal pressure bulge -->
  <ellipse cx="32" cy="40" rx="8" ry="8" fill="#7C6CF0" fill-opacity="0.45"/>
  <!-- radiation arcs from neck -->
  <path d="M22 10 C28 5 36 5 42 10" fill="none" stroke="#2FC486" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 7 C26 1 38 1 46 7" fill="none" stroke="#2FC486" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
